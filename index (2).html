<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎮 Game Room - غرفة اللعب</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
        min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                color: #fff;
                    display: flex;
                        align-items: center;
                            justify-content: center;
                                padding: 20px;
                                    overflow-x: hidden;
                                      }
                                        .screen { display: none; width: 100%; max-width: 480px; animation: fadeIn .4s ease; }
                                          .screen.active { display: block; }
                                            @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

                                              .card {
                                                  background: rgba(255,255,255,0.08);
                                                      backdrop-filter: blur(15px);
                                                          border: 1px solid rgba(255,255,255,0.15);
                                                              border-radius: 20px;
                                                                  padding: 35px 25px;
                                                                      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
                                                                        }
                                                                          h1 { text-align: center; margin-bottom: 25px; font-size: 28px; background: linear-gradient(90deg,#00f2fe,#4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                                                                            h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
                                                                              label { display: block; margin: 12px 0 6px; font-size: 14px; color: #cfd8ff; }
                                                                                input, select {
                                                                                    width: 100%;
                                                                                        padding: 12px 14px;
                                                                                            border-radius: 10px;
                                                                                                border: 1px solid rgba(255,255,255,0.2);
                                                                                                    background: rgba(0,0,0,0.3);
                                                                                                        color: #fff;
                                                                                                            font-size: 16px;
                                                                                                                outline: none;
                                                                                                                    transition: .2s;
                                                                                                                      }
                                                                                                                        input:focus, select:focus { border-color: #4facfe; box-shadow: 0 0 0 3px rgba(79,172,254,0.25); }
                                                                                                                          button {
                                                                                                                              width: 100%;
                                                                                                                                  padding: 13px;
                                                                                                                                      margin-top: 18px;
                                                                                                                                          border: none;
                                                                                                                                              border-radius: 10px;
                                                                                                                                                  font-size: 16px;
                                                                                                                                                      font-weight: bold;
                                                                                                                                                          cursor: pointer;
                                                                                                                                                              background: linear-gradient(90deg,#00f2fe,#4facfe);
                                                                                                                                                                  color: #0f0c29;
                                                                                                                                                                      transition: transform .15s, box-shadow .15s;
                                                                                                                                                                        }
                                                                                                                                                                          button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79,172,254,0.4); }
                                                                                                                                                                            button.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
                                                                                                                                                                              button.danger { background: linear-gradient(90deg,#ff6b6b,#ee5a6f); color: #fff; }

                                                                                                                                                                                .code-box {
                                                                                                                                                                                    background: rgba(0,0,0,0.4);
                                                                                                                                                                                        border: 2px dashed #4facfe;
                                                                                                                                                                                            border-radius: 12px;
                                                                                                                                                                                                padding: 18px;
                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                        font-size: 32px;
                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                letter-spacing: 6px;
                                                                                                                                                                                                                    color: #00f2fe;
                                                                                                                                                                                                                        margin: 15px 0;
                                                                                                                                                                                                                            user-select: all;
                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                .info { text-align: center; color: #b0b8d6; font-size: 13px; margin-top: 10px; }
                                                                                                                                                                                                                                  .warning { background: rgba(255,193,7,0.15); border: 1px solid #ffc107; color: #ffd54f; padding: 12px; border-radius: 10px; text-align: center; margin-top: 15px; font-size: 14px; }
                                                                                                                                                                                                                                    .user-badge { text-align: center; color: #00f2fe; margin-bottom: 10px; font-size: 14px; }
                                                                                                                                                                                                                                      .error { color: #ff6b6b; text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }
                                                                                                                                                                                                                                        .success { color: #4ade80; text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }

                                                                                                                                                                                                                                          .toggle-link {
                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                  margin-top: 18px;
                                                                                                                                                                                                                                                      color: #b0b8d6;
                                                                                                                                                                                                                                                          font-size: 14px;
                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                              .toggle-link a {
                                                                                                                                                                                                                                                                  color: #4facfe;
                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                          text-decoration: none;
                                                                                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                  .toggle-link a:hover { text-decoration: underline; }

                                                                                                                                                                                                                                                                                    .divider {
                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                            margin: 20px 0 10px;
                                                                                                                                                                                                                                                                                                color: #6b7280;
                                                                                                                                                                                                                                                                                                    font-size: 12px;
                                                                                                                                                                                                                                                                                                        position: relative;
                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                            .divider::before, .divider::after {
                                                                                                                                                                                                                                                                                                                content: '';
                                                                                                                                                                                                                                                                                                                    position: absolute;
                                                                                                                                                                                                                                                                                                                        top: 50%;
                                                                                                                                                                                                                                                                                                                            width: 40%;
                                                                                                                                                                                                                                                                                                                                height: 1px;
                                                                                                                                                                                                                                                                                                                                    background: rgba(255,255,255,0.1);
                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                        .divider::before { right: 0; }
                                                                                                                                                                                                                                                                                                                                          .divider::after { left: 0; }
                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                          </head>
                                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                                          <!-- ============ شاشة تسجيل حساب جديد ============ -->
                                                                                                                                                                                                                                                                                                                                          <div id="registerScreen" class="screen active">
                                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                                <h1>📝 إنشاء حساب جديد</h1>

                                                                                                                                                                                                                                                                                                                                                    <label>اسم اللاعب</label>

                                                                                                                                                                                                                                                                                                                                                            <label>البريد الإلكتروني</label>

                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="register()">إنشاء الحساب ✨</button>

                                                                                                                                                                                                                                                                                                                                                                                            <div class="toggle-link">

                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                        <!-- ============ شاشة تسجيل الدخول ============ -->

                                                                                                                                                                                                                                                                                                                                                                                                          <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                              <h1>🔑 تسجيل الدخول</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                  <label>البريد الإلكتروني</label>
                                                                                                                                                                                                                                                                                                                                                                                                                      <input type="email" id="loginEmail" placeholder="example@mail.com" />

                                                                                                                                                                                                                                                                                                                                                                                                                          <label>كلمة المرور</label>
                                                                                                                                                                                                                                                                                                                                                                                                                              <input type="password" id="loginPassword" placeholder="كلمة المرور" />

                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="error" id="loginError"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="toggle-link">
                                                                                                                                                                                                                                                                                                                                                                                                                                                ليس لديك حساب؟ <a onclick="showScreen('registerScreen')">أنشئ حساباً جديداً</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                      <!-- ============ الشاشة الرئيسية ============ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="homeScreen" class="screen">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="user-badge">👤 مرحباً، <span id="displayName"></span><br><small style="color:#8b95b8;" id="displayEmail"></small></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1>اختر إجراءك</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="showScreen('createScreen')">🏠 إنشاء غرفة جديدة</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="secondary" onclick="showScreen('joinScreen')">🔑 الانضمام بكود</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="danger" style="margin-top:30px;" onclick="logout()">🚪 تسجيل الخروج</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <!-- ============ شاشة إنشاء غرفة ============ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="createScreen" class="screen">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>🏠 إنشاء غرفة</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>اسم الغرفة</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="roomNameInput" placeholder="مثال: غرفة الأصدقاء" maxlength="30" />

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>طريقة اللعب</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="gameModeSelect">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option value="quiz">🧠 كويز (أسئلة)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="drawing">🎨 رسم وتخمين</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="cards">🃏 لعبة ورق</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="truth">💬 صراحة أو جرأة</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="createRoom()">إنشاء الغرفة ✨</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- ============ شاشة عرض الغرفة ============ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="roomScreen" class="screen">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1>🎉 الغرفة جاهزة!</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="info">اسم الغرفة: <b id="roomTitle"></b></p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>شارك هذا الكود مع أصدقائك:</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="info" style="margin-top:20px;">اللاعبون داخل الغرفة:</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- ============ شاشة الانضمام ============ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="joinScreen" class="screen">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>🔑 الانضمام لغرفة</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>أدخل كود الغرفة</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="joinCodeInput" placeholder="مثال: A3F9K2" maxlength="6" style="text-transform:uppercase; letter-spacing:4px; text-align:center; font-weight:bold;" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="error" id="joinError"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="joinRoom()">دخول الغرفة 🚪</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="secondary" onclick="showScreen('homeScreen')">رجوع</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /* ========== أدوات مساعدة ========== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function showScreen(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById(id).classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // مسح رسائل الخطأ عند التنقل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.querySelectorAll('.error').forEach(e => e.textContent = '');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function generateCode(len = 6) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let code = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < len; i++) code += chars[Math.floor(Math.random() * chars.length)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return code;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function getRooms() { return JSON.parse(localStorage.getItem('gameRooms') || '{}'); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function saveRooms(r) { localStorage.setItem('gameRooms', JSON.stringify(r)); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function getUsers() { return JSON.parse(localStorage.getItem('gameUsers') || '{}'); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function saveUsers(u) { localStorage.setItem('gameUsers', JSON.stringify(u)); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /* ========== تشفير كلمة المرور بـ SHA-256 ========== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              async function hashPassword(password) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const encoder = new TextEncoder();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const data = encoder.encode(password);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const hashArray = Array.from(new Uint8Array(hashBuffer));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* ========== التحقق من صحة الإيميل ========== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function isValidEmail(email) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* ========== تسجيل حساب جديد ========== */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function register() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const name = document.getElementById('regName').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const email = document.getElementById('regEmail').value.trim().toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const password = document.getElementById('regPassword').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const password2 = document.getElementById('regPassword2').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const err = document.getElementById('regError');
